<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FaMovie — Minha Biblioteca</title>
<meta name="theme-color" content="#141414">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 44'%3E%3Cpath d='M0 0 L4.2 0 L6 44 L0 44 Z' fill='%23e50914'/%3E%3Cpath d='M0 0 L4.2 0 L16 44 L10.6 44 Z' fill='%23e50914'/%3E%3Cpath d='M11.8 0 L16 0 L16 44 L10.2 44 Z' fill='%23e50914'/%3E%3C/svg%3E">
<style>
/* ============================================================
   NETFLIX CLONE — REDETOONS EDITION
   Estilo fiel à interface original (dark UI, vermelho #E50914)
   ============================================================ */
:root{
  --vermelho:#e50914;
  --vermelho-esc:#b20710;
  --fundo:#141414;
  --fundo2:#181818;
  --texto:#ffffff;
  --cinza:#b3b3b3;
  --cinza2:#808080;
  --card:16.666%;
  --sombra:0 8px 30px rgba(0,0,0,.75);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  color:var(--texto);overflow-x:hidden;background:#000;
  font-family:'Helvetica Neue',Helvetica,'Segoe UI',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body.travado{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.escondido{display:none !important}

/* ================= TUDUM / INTRO ================= */
#intro{
  position:fixed;inset:0;background:#000;z-index:9000;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
}
#intro .letras{
  display:flex;gap:.02em;perspective:800px;
}
#intro .letra{
  font-size:clamp(46px,13vw,190px);font-weight:900;letter-spacing:-.06em;
  color:var(--vermelho);text-shadow:0 0 40px rgba(229,9,20,.75);
  opacity:0;transform:scale(2.4) translateZ(0);filter:blur(14px);
  animation:surgir .72s cubic-bezier(.2,.9,.25,1) forwards;
}
#intro .letra.d2{color:#fff;text-shadow:0 0 44px rgba(255,255,255,.65)}
@keyframes surgir{
  0%{opacity:0;transform:scale(2.4);filter:blur(14px)}
  55%{opacity:1;filter:blur(1px)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
#intro.zoom .letras{animation:afastar 1.5s cubic-bezier(.5,0,.75,0) forwards}
@keyframes afastar{
  0%{transform:scale(1);opacity:1}
  100%{transform:scale(9);opacity:0}
}
#intro .pular{
  position:absolute;right:26px;bottom:26px;font-size:13px;color:#8c8c8c;
  border:1px solid #333;border-radius:3px;padding:8px 14px;letter-spacing:.05em;
  text-transform:uppercase;
}
#intro .pular:hover{color:#fff;border-color:#777}
#intro .barras{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#intro .barra{
  position:absolute;top:-30%;width:2px;height:160%;background:linear-gradient(transparent,rgba(229,9,20,.55),transparent);
  opacity:0;
}
#intro.zoom .barra{animation:raios .9s ease-out forwards}
@keyframes raios{0%{opacity:0;transform:scaleY(.2)}40%{opacity:.9}100%{opacity:0;transform:scaleY(1.4)}}

/* ================= PERFIS ================= */
#perfis{
  position:fixed;inset:0;background:#000;z-index:8000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  animation:aparecer .5s ease;
}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
#perfis h1{font-size:clamp(26px,3.6vw,52px);font-weight:400;margin:0;letter-spacing:.01em}
.perfis-grade{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.perfil{display:flex;flex-direction:column;align-items:center;gap:12px;width:132px;transition:transform .2s}
.perfil:hover{transform:scale(1.07)}
.perfil .avatar{
  width:132px;height:132px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:52px;font-weight:900;color:#000;box-shadow:0 4px 18px rgba(0,0,0,.5);
  border:3px solid transparent;position:relative;overflow:hidden;
}
.perfil .avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.35),transparent 55%)}
.perfil:hover .avatar{border-color:#e5e5e5}
.perfil span{color:var(--cinza);font-size:14px}
.perfil:hover span{color:#fff}
.perfil.add .avatar{background:transparent;border:2px solid #4d4d4d;color:#808080;font-size:64px}
.btn-gerenciar{
  border:1px solid #808080;color:#808080;padding:11px 22px;font-size:14px;letter-spacing:.06em;
  text-transform:uppercase;transition:.2s;
}
.btn-gerenciar:hover{color:#fff;border-color:#fff}

/* ================= HEADER ================= */
/* ================= MENU LATERAL (como nas referências) ================= */
body{padding-left:76px}
#lateral{
  position:fixed;left:0;top:0;bottom:0;width:76px;z-index:1200;background:#000;
  display:flex;flex-direction:column;align-items:center;padding:16px 0 16px;gap:4px;
  border-right:1px solid rgba(255,255,255,.10);
}
#lateral .logo-mini{font-size:17.5px;font-weight:900;letter-spacing:-.05em;line-height:1;margin-bottom:12px;cursor:pointer;user-select:none}
.m-fa{color:var(--vermelho)}
.m-mv{color:#fff}
#lateral .ics{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center}
#lateral .ic{
  position:relative;width:100%;height:54px;display:flex;align-items:center;justify-content:center;
  color:#9d9d9d;transition:color .18s,background-color .18s;
}
#lateral .ic svg{width:26px;height:26px;display:block}
#lateral .ic > svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#lateral .ic:hover{color:#fff;background:rgba(255,255,255,.06)}
#lateral .ic.on{color:#fff}
#lateral .ic.on::after{content:'';position:absolute;bottom:5px;width:22px;height:2.5px;background:var(--vermelho);border-radius:2px}
#lateral .fim-lateral{margin-top:auto;display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
#lateral .ic .bolha{
  position:absolute;top:8px;right:18px;background:var(--vermelho);border-radius:20px;font-size:10px;
  font-weight:700;padding:2px 5px;min-width:17px;text-align:center;color:#fff;
}
#lateral #abre-config svg{fill:currentColor;stroke:none;width:24px;height:24px}
/* painel de novidades (abre à direita do menu) */
#lateral .painel-sino{
  position:absolute;left:62px;top:0;width:352px;max-height:72vh;overflow-y:auto;background:#0a0a0a;
  border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:8px 0;text-align:left;
  opacity:0;visibility:hidden;transform:translateX(-8px);transition:.2s;z-index:1300;
  box-shadow:0 18px 50px rgba(0,0,0,.9);cursor:default;color:#fff;
}
#lateral #sino.aberto .painel-sino{opacity:1;visibility:visible;transform:translateX(0)}
.painel-sino h4{margin:8px 16px 12px;font-size:14px;color:#e5e5e5;font-weight:700}
.painel-sino .linha{display:flex;gap:12px;padding:9px 16px;align-items:center;cursor:pointer}
.painel-sino .linha:hover{background:rgba(255,255,255,.08)}
.painel-sino .linha img{width:104px;height:59px;object-fit:cover;border-radius:4px;background:#222;flex:0 0 104px}
.painel-sino .linha .tx{font-size:12.5px;color:#b3b3b3;line-height:1.4;min-width:0}
.painel-sino .linha .tx b{display:block;color:#fff;font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.painel-sino .nova{background:var(--vermelho);color:#fff;font-size:9px;font-weight:800;border-radius:2px;padding:2px 5px;margin-left:6px;letter-spacing:.04em}
/* perfil (rodapé do menu) */
#lateral .menu-perfil{position:relative;padding:6px;border-radius:6px;cursor:pointer;transition:background-color .18s}
#lateral .menu-perfil:hover{background:rgba(255,255,255,.06)}
#lateral .menu-perfil .avatar{width:34px;height:34px;border-radius:5px;display:block}
#lateral .dropdown{
  position:absolute;left:58px;bottom:-6px;background:#0a0a0a;border:1px solid rgba(255,255,255,.15);
  min-width:232px;padding:8px 0;font-size:13px;border-radius:6px;z-index:1300;
  opacity:0;visibility:hidden;transform:translateX(-8px);transition:.2s;box-shadow:0 18px 50px rgba(0,0,0,.9);
}
#lateral .menu-perfil:hover .dropdown{opacity:1;visibility:visible;transform:translateX(0)}
#lateral .dropdown .cab-perfis{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8c8c8c;padding:8px 14px 6px}
#lateral .dropdown a{display:flex;align-items:center;gap:11px;padding:11px 16px;color:#e5e5e5;white-space:nowrap;font-size:14px}
#lateral .dropdown a:hover{background:rgba(255,255,255,.09)}
#lateral .dropdown a.ativo{background:rgba(229,9,20,.16)}
#lateral .dropdown a.trocar{border-top:1px solid rgba(255,255,255,.15);margin-top:6px;padding-top:12px}

/* ================= HERO ================= */
#hero{
  position:relative;height:min(76vh,700px);min-height:440px;display:flex;align-items:flex-end;
  padding:0 4% 96px;overflow:hidden;
}
#hero .fundo{position:absolute;inset:0;background-size:cover;background-position:center 14%;transform:scale(1.04)}
#hero .veuL{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.55) 40%,transparent 75%)}
#hero .veuB{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,transparent,rgba(20,20,20,.65) 42%,#141414 100%)}
#hero .conteudo{position:relative;max-width:640px;z-index:3}
#hero .tag{
  font-size:13px;letter-spacing:.32em;color:#d2d2d2;margin-bottom:14px;display:flex;align-items:center;gap:12px;
  text-transform:uppercase;
}
#hero .tag::before{content:'';width:26px;height:2px;background:var(--vermelho)}
#hero h1{
  font-size:clamp(42px,6.4vw,86px);line-height:.96;margin:0 0 18px;font-weight:900;letter-spacing:-.02em;
  text-shadow:0 3px 18px rgba(0,0,0,.75);
  animation:subir .8s cubic-bezier(.2,.8,.25,1) both;
}
#hero .logo-titulo{max-width:min(560px,72vw);max-height:190px;object-fit:contain;margin-bottom:20px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.7));animation:subir .8s .05s cubic-bezier(.2,.8,.25,1) both}
@keyframes subir{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
#hero .meta{display:flex;align-items:center;gap:14px;font-size:15px;color:#e5e5e5;margin-bottom:16px;flex-wrap:wrap}
.rb{background:var(--vermelho);color:#fff;font-weight:700;font-size:12px;padding:2px 7px;border-radius:2px;letter-spacing:.04em}
.rb.amarelo{background:#f5c518;color:#000}
.rb.verde{background:#46d369;color:#000}
.ano{border:1px solid #9a9a9a;padding:1px 6px;font-size:12px;color:#e5e5e5;border-radius:2px}
#hero .sinopse{font-size:clamp(14px,1.5vw,18px);line-height:1.5;color:#e9e9e9;text-shadow:0 2px 8px rgba(0,0,0,.7);margin:0 0 24px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.botoes-hero{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:11px;border-radius:4px;padding:11px 26px;font-size:16px;font-weight:700;
  transition:.18s;white-space:nowrap;
}
.btn.claro{background:#fff;color:#000}
.btn.claro:hover{background:rgba(255,255,255,.78)}
.btn.escuro{background:rgba(109,109,110,.7);color:#fff}
.btn.escuro:hover{background:rgba(109,109,110,.5)}
.btn svg{width:24px;height:24px;fill:currentColor}
#hero .lado{
  position:absolute;right:0;bottom:132px;z-index:3;display:flex;align-items:center;gap:16px;
  background:rgba(51,51,51,.6);border-left:3px solid var(--vermelho);padding:9px 26px 9px 14px;
}
#hero .lado .ep{font-size:15px;color:#e5e5e5}
#hero .lado .classif{border-left:2px solid #fff;padding-left:14px;font-size:15px}

/* ================= FILEIRAS ================= */
#conteudo{position:relative;z-index:5;margin-top:-72px;padding-bottom:60px}
.fileira{margin:0 0 34px;position:relative}
.fileira h2{
  font-size:clamp(17px,1.7vw,24px);font-weight:700;margin:0 0 12px;padding:0 4%;
  display:flex;align-items:center;gap:10px;letter-spacing:-.01em;
}
.fileira h2 .ver-tudo{margin-left:auto;font-size:14.5px;font-weight:600;color:#b3b3b3;opacity:0;transition:.25s;letter-spacing:.04em}
.fileira:hover h2 .ver-tudo{opacity:1}
.fileira h2 .ver-tudo:hover{color:#fff}
.trilho{
  display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;padding:22px 4% 60px;
  scrollbar-width:none;
}
.trilho::-webkit-scrollbar{display:none}
.seta{
  position:absolute;top:44px;bottom:56px;width:4%;min-width:44px;z-index:60;
  display:flex;align-items:center;justify-content:center;border-radius:4px;
  background:rgba(20,20,20,.72);opacity:0;transition:.25s;
}
.fileira:hover .seta{opacity:1}
.seta:hover{background:rgba(20,20,20,.92)}
.seta svg{width:34px;height:34px;fill:#fff;transform:scale(.85);transition:.2s}
.seta:hover svg{transform:scale(1.05)}
.seta.esq{left:0}
.seta.dir{right:0}

/* ---- Card ---- */
.card{
  position:relative;flex:0 0 auto;width:calc(var(--card) - 8px);min-width:150px;aspect-ratio:16/9;
  border-radius:4px;overflow:hidden;cursor:pointer;background:#222;
  transition:transform .32s cubic-bezier(.2,.8,.3,1),box-shadow .32s;
  transform-origin:center;
}
.card.poster{aspect-ratio:2/3}
.card img.thumb{width:100%;height:100%;object-fit:cover;display:block}
.card .fallback{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:12px;gap:8px;
}
.card .fallback .tt{font-weight:900;font-size:15px;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.card .fallback .sub{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.14em;text-transform:uppercase}
.card:hover{
  transform:scale(1.34) translateY(-6px);z-index:80;box-shadow:0 14px 44px rgba(0,0,0,.85);
  transition-delay:.32s;
}
.card:hover ~ .card{}
.card .info{
  position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(20,20,20,0) 0%,rgba(20,20,20,.94) 45%,#181818 100%);
  padding:34px 12px 12px;opacity:0;transition:opacity .3s .32s;
}
.card:hover .info{opacity:1}
.card .info .acoes{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.bol{
  width:38px;height:38px;border-radius:50%;border:1.6px solid rgba(255,255,255,.65);display:flex;align-items:center;
  justify-content:center;background:rgba(42,42,42,.85);transition:.18s;flex:0 0 auto;
}
.bol:hover{background:#fff}
.bol:hover svg{fill:#000}
.bol svg{width:19px;height:19px;fill:#fff;transition:.18s}
.bol.play{background:#fff;border-color:#fff}
.bol.play svg{fill:#000}
.bol.play:hover{background:rgba(255,255,255,.75)}
.bol.mais{margin-left:auto}
.card .info .linha1{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px;flex-wrap:wrap}
.card .info .generos{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#dcdcdc;flex-wrap:wrap}
.ponto{width:3px;height:3px;border-radius:50%;background:#a3a3a3}
.badge-top{
  position:absolute;top:8px;left:8px;background:var(--vermelho);font-size:11px;font-weight:800;
  padding:3px 8px;border-radius:3px;letter-spacing:.05em;z-index:2;
}
.badge-tipo{
  position:absolute;top:8px;right:8px;background:rgba(0,0,0,.72);font-size:10px;font-weight:700;
  padding:3px 7px;border-radius:3px;letter-spacing:.12em;z-index:2;
}
.barra-prog{position:absolute;left:12px;right:12px;bottom:8px;height:3px;background:rgba(255,255,255,.35);border-radius:2px;z-index:3}
.barra-prog i{display:block;height:100%;background:var(--vermelho);border-radius:2px}

/* ---- Top 10 ---- */
.card.top{width:auto;display:flex;align-items:flex-end;gap:0;background:none;aspect-ratio:auto;overflow:visible}
.card.top:hover{transform:scale(1.18) translateY(-6px)}
.card.top .num{
  font-size:clamp(96px,13vw,240px);line-height:.74;font-weight:900;letter-spacing:-.08em;
  color:#141414;-webkit-text-stroke:4px #6d6d6d;margin-right:-12px;user-select:none;flex:0 0 auto;
}
.card.top .miniatura{width:150px;aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:#222;position:relative}
.card.top .miniatura img{width:100%;height:100%;object-fit:cover}
.card.top .info{display:none}

/* ================= MODAL DETALHES ================= */
#modal{
  position:fixed;inset:0;z-index:3000;overflow-y:auto;padding:44px 0 60px;
  background:rgba(0,0,0,.72);animation:aparecer .25s ease;
}
#modal .caixa{
  width:min(96%,880px);margin:0 auto;background:#181818;border-radius:8px;overflow:hidden;
  box-shadow:var(--sombra);animation:zoomIn .34s cubic-bezier(.2,.8,.3,1);
}
@keyframes zoomIn{from{transform:scale(.9) translateY(24px);opacity:0}to{transform:none;opacity:1}}
#modal .topo{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
#modal .topo .bd{position:absolute;inset:0;background-size:cover;background-position:center}
#modal .topo .veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,24,24,0) 42%,rgba(24,24,24,.85) 82%,#181818 100%)}
#modal .topo .acoes{
  position:absolute;left:36px;bottom:34px;right:36px;display:flex;flex-direction:column;gap:22px;
}
#modal .logo-titulo{max-width:min(420px,60%);max-height:130px;object-fit:contain;object-position:left bottom}
#modal .topo h2{margin:0;font-size:clamp(30px,4.4vw,58px);font-weight:900;letter-spacing:-.02em;text-shadow:0 3px 14px rgba(0,0,0,.7)}
#modal .topo .botoes{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#modal .fechar{
  position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;background:rgba(24,24,24,.9);
  display:flex;align-items:center;justify-content:center;z-index:5;
}
#modal .fechar:hover{background:#000;transform:scale(1.08)}
#modal .corpo{padding:22px 36px 40px;display:grid;grid-template-columns:2fr 1fr;gap:34px}
#modal .col-esc{display:flex;flex-direction:column;gap:26px}
#modal .col-dir{display:flex;flex-direction:column;gap:16px;font-size:13.5px;color:#b3b3b3}
#modal .col-dir .rot{color:#777}
#modal .col-dir b{color:#e5e5e5;font-weight:400}
#modal .meta{display:flex;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
#modal .meta .match{color:#46d369;font-weight:700}
#modal .sinopse{font-size:15px;line-height:1.55;color:#e5e5e5;margin:0}
#modal .tags{display:flex;gap:8px;flex-wrap:wrap}
#modal .tags span{background:rgba(255,255,255,.09);padding:5px 11px;border-radius:20px;font-size:12px;color:#e5e5e5}

/* episódios */
.eps{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.eps .cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:14px;flex-wrap:wrap}
.eps select{
  background:#000;color:#fff;border:1px solid #333;padding:9px 12px;border-radius:3px;font-size:14px;font-weight:600;
}
.ep{
  display:flex;gap:14px;padding:14px 8px;border-bottom:1px solid #2b2b2b;cursor:pointer;transition:.2s;border-radius:4px;
}
.ep:hover{background:#222}
.ep .n{font-size:22px;color:#b3b3b3;width:34px;text-align:center;flex:0 0 auto;padding-top:14px}
.ep .mini{width:150px;aspect-ratio:16/9;background:#333;border-radius:4px;overflow:hidden;position:relative;flex:0 0 auto}
.ep .mini img{width:100%;height:100%;object-fit:cover}
.ep .mini .playme{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:.2s;
}
.ep:hover .mini .playme{opacity:1}
.ep .txt{flex:1;min-width:0}
.ep .txt .t1{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;margin-bottom:6px;font-weight:600}
.ep .txt .t1 span{color:#b3b3b3;font-weight:400;flex:0 0 auto}
.ep .txt p{margin:0;font-size:13px;color:#b3b3b3;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.ficha{display:grid;grid-template-columns:1fr 300px;gap:40px;margin-top:28px}

.sin-assistir{color:#e5e5e5;line-height:1.55;font-size:15px;margin:0 0 20px;max-width:760px}
.faixa-acoes{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.dica-drive{font-size:12.5px;color:#8c8c8c}
.ficha .col-dir{font-size:13.5px;color:#b3b3b3;line-height:2}
.ficha .col-dir .rot{color:#777}
.ficha .col-dir b{color:#e5e5e5}
.eps-assistir{margin-top:36px;border-top:1px solid rgba(255,255,255,.14);padding-top:22px}
.cab-eps{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cab-eps h3{margin:0;font-size:19px}
.cab-eps select{background:#000;color:#fff;border:1px solid #555;border-radius:3px;padding:8px 12px;font-size:14px;outline:0}
.trilho-eps{display:grid;gap:12px}
.ep-card{display:flex;gap:16px;padding:12px;border-radius:6px;background:rgba(255,255,255,.03);cursor:pointer;transition:.2s}

.ep-card .im{position:relative;width:204px;flex:0 0 204px}

.ep-card .playme svg{width:34px;height:34px;fill:#fff}
.ep-card .tx{min-width:0}
.ep-card .l1{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#b3b3b3;margin-bottom:4px}
.ep-card .l1 b{color:#fff}
.ep-card h4{margin:0 0 6px;font-size:15.5px}
.ep-card p{margin:0;font-size:13px;color:#b3b3b3;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

@media (max-width:900px){

/* ================= BUSCA / GRADE ================= */

}

#tela-busca .vazio{text-align:center;color:#b3b3b3;margin-top:16vh;font-size:18px;line-height:1.7}

.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:30px 16px;margin-top:24px}
.grade .card{width:100%;min-width:0}
#filtros{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.chip{

}

.btn-cheio{background:var(--vermelho);color:#fff;border-radius:4px;padding:12px 24px;font-weight:700;font-size:15px}
.btn-cheio:hover{background:var(--vermelho-esc)}

.stat{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px;padding-top:20px;border-top:1px solid #2b2b2b}

/* ================= FOOTER ================= */

}
#perfis.modo-editar .lapis,.perfil:hover .lapis{display:flex}
.perfil .lapis:hover{background:#fff;color:#000}

#editor-perfil{position:absolute;inset:0;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px;overflow-y:auto;animation:aparecer .25s ease}
#editor-perfil .painel-ed{width:min(96%,680px);background:#181818;border-radius:8px;padding:28px 32px 30px;box-shadow:0 18px 60px rgba(0,0,0,.85);max-height:94vh;overflow-y:auto}

.ed-topo{display:grid;grid-template-columns:180px 1fr;gap:28px}

.ed-campos input[type=text]{width:100%;background:#0d0d0d;border:1px solid #333;border-radius:4px;color:#fff;padding:11px 12px;font-size:15px;outline:0}
.ed-campos input[type=text]:focus{border-color:#fff}
.grade-faces{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.face{background:transparent;border:2px solid transparent;border-radius:9px;padding:0;line-height:0;transition:.15s}

.painel-sino .nova{background:#e50914;color:#fff;font-size:9px;font-weight:800;border-radius:2px;padding:2px 5px;margin-left:6px;letter-spacing:.04em}
.bol.chev{margin-left:auto}
.card:hover{cursor:pointer}
.fileira h2 .ver-tudo i{font-style:normal;display:inline-block;transition:.25s}

.dropdown{box-shadow:0 14px 44px rgba(0,0,0,.85)}

/* ================= v4: polimento, pôsteres na home, categorias ================= */
::selection{background:var(--vermelho);color:#fff}
:focus-visible{outline:2px solid rgba(229,9,20,.9);outline-offset:2px}

/* fundo do herói: mais profundo e cinematográfico */

#hero .veuL{background:linear-gradient(90deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.6) 38%,rgba(0,0,0,.12) 68%,transparent 84%)}

.ordem button{
  border:1px solid #4d4d4d;border-radius:18px;padding:8px 18px;font-size:13.5px;color:#d2d2d2;
  transition:.18s;background:rgba(255,255,255,.03);
}
.ordem button:hover{border-color:#fff;color:#fff}
.ordem button.on{background:#fff;color:#000;border-color:#fff;font-weight:700}
/* etiqueta de episódio no card "Continuar assistindo" */
.ep-tag{background:rgba(255,255,255,.16);border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700;color:#fff}
/* aparecimento suave das capas */
.card{background:#1a1a1a}
.card img.thumb{opacity:0;transition:opacity .5s ease}
.card img.thumb.pronta{opacity:1}
/* logo cresce quando a barra fica sólida (igual à Netflix) */
.logo{transition:transform .35s ease}
#header.solido .logo{transform:scale(1.13)}
.nav a:hover{color:#fff;opacity:1}
/* rodapé: seletor de idioma */
.rodape-extra{margin:14px 0 4px}
.lingua{
  background:#000;color:#b3b3b3;border:1px solid #4d4d4d;border-radius:2px;

}
.lingua:hover{border-color:#8c8c8c;color:#fff}
/* detalhe: brilho suave nos títulos das fileiras ao passar o mouse */
.fileira h2{cursor:default}
.fileira:hover h2{color:#fff}

/* ================= v6: preto puro, desempenho, estilo das referências ================= */
/* botões pílula */
.btn{border-radius:999px !important;padding:16px 40px !important;font-weight:700;font-size:16.5px;gap:11px}
.btn.claro{background:#e50914 !important;color:#fff !important;box-shadow:0 6px 22px rgba(229,9,20,.35)}
.btn.claro:hover{background:#f6121d !important}
.btn.claro svg{fill:#fff}
.btn.escuro{background:rgba(109,109,110,.72) !important;color:#fff !important;backdrop-filter:none}
.btn.escuro:hover{background:rgba(109,109,110,.55) !important}
.btn.escuro svg{fill:#fff}

/* selo "N SÉRIE" / "N FILME" do herói */
#hero .tag{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.16em;font-size:13px;color:#e5e5e5}
#hero .tag b{color:var(--vermelho);font-size:24px;font-weight:900;letter-spacing:-.06em;font-family:'Helvetica Neue',Arial,sans-serif;line-height:1}
#hero .tag span{border-left:0}

/* chip de nota (estilo IMDb) */
.nota-chip{background:#f5c518;color:#000;font-weight:800;font-size:12px;padding:2px 7px;border-radius:3px;letter-spacing:.02em}

/* barra de progresso colada embaixo do card (como no "Continue Watching") */
.barra-prog{left:0;right:0;bottom:0;height:4px;border-radius:0;background:rgba(255,255,255,.28);z-index:4}
.barra-prog i{background:var(--vermelho);height:100%;display:block;box-shadow:0 0 8px rgba(229,9,20,.7)}

/* desempenho: efeitos caros removidos */
.card .info{backdrop-filter:none}
.painel-sino,.dropdown{backdrop-filter:none}
.card{transition:transform .28s cubic-bezier(.2,.8,.3,1),box-shadow .28s}
.card:hover{transform:scale(1.18) translateY(-4px)}
.card.poster:hover{transform:scale(1.14) translateY(-4px)}
.card.top .miniatura{transition:none}

/* desempenho: fileiras fora da tela nem são renderizadas */
.fileira{content-visibility:auto;contain-intrinsic-size:auto 340px}
.trilho.posters{contain-intrinsic-size:auto 420px}

/* filtros em uma linha só (rolável), mais limpo */
#filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
#filtros::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 20px;font-size:14px}

/* telas pretas de verdade */
#tela-busca{background:#000}
#player{background:#000}


/* aviso de "modo leve" no rodapé */
.modo-leve{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0 0;font-size:12.5px;color:#8c8c8c}

/* ================= v7: busca, marca e abertura FaMovie ================= */
.topo-busca{
  position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:14px;
  background:#000;padding:18px 0 16px;margin:0 -4% 6px;padding-left:4%;padding-right:4%;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.topo-busca .icone{display:flex;color:#b3b3b3}
.topo-busca .icone svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.topo-busca input{
  flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:20.5px;font-weight:600;letter-spacing:-.01em;
}
.topo-busca input::placeholder{color:#7a7a7a;font-weight:400}
.topo-busca .limpa{color:#b3b3b3;font-size:17px;padding:4px 6px;border-radius:4px}

/* marca no herói */
#hero .tag{align-items:center}
#hero .tag .marca-fa{font-size:21px;font-weight:900;letter-spacing:-.05em;font-family:'Helvetica Neue',Arial,sans-serif;line-height:1}
#hero .tag span{font-size:12.5px;letter-spacing:.34em;color:#d2d2d2;font-weight:700;margin-left:10px;padding-left:12px;border-left:1px solid rgba(255,255,255,.35)}

/* abertura FaMovie */
#intro .brilho-fundo{position:absolute;width:min(120vw,1400px);height:min(120vw,1400px);border-radius:50%;
  background:radial-gradient(circle, rgba(229,9,20,.16) 0%, rgba(229,9,20,.05) 38%, transparent 62%);
  animation:pulsoIntro 2.6s ease-in-out infinite alternate}
@keyframes pulsoIntro{from{transform:scale(.92);opacity:.7}to{transform:scale(1.08);opacity:1}}
#intro .fa-abertura{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
#intro .fm-marca{position:relative;display:flex;align-items:baseline;font-weight:900;font-size:clamp(56px,12vw,178px);letter-spacing:-.055em;line-height:1}
#intro .lt{display:inline-block;opacity:0;transform:translateY(30px) scale(.82);filter:blur(12px);animation:letraFm .78s cubic-bezier(.16,.9,.25,1.08) forwards}
#intro .lt.r{color:var(--vermelho);text-shadow:0 0 46px rgba(229,9,20,.85)}

#intro.zoom .fa-abertura{animation:afastar 1.35s cubic-bezier(.5,0,.75,0) forwards}

/* ================= v8: player em tela cheia, X destacado, semelhantes ================= */
#player.on{display:block}
#player .quadro-cheio{position:absolute;top:0;left:0;right:0;bottom:0;background:#000}
#player .quadro-cheio iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
/* seta de voltar flutuante (único controle) */
.voltar-flutuante{
  position:fixed;top:18px;left:18px;z-index:5010;width:58px;height:58px;border-radius:50%;

/* aviso do título: aparece e some sozinho, sem atrapalhar */
.dica-assistindo{

  animation:dicaSome 4.5s ease forwards;
}
@keyframes dicaSome{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0}}

/* botão X do modal: bem destacado */
#modal .fechar{
  position:absolute;top:14px;right:14px;width:56px;height:56px;border-radius:50%;
  background:#fff;border:2px solid rgba(0,0,0,.25);z-index:8;

/* Arte gerada (fallback quando não há capa no TMDB) */
const PALETAS = [
  ['#3a0d0d','#7a1010','#e50914'], ['#0d1b3a','#12306b','#2b6cff'],
  ['#2b0d3a','#5a1370','#b026ff'], ['#0d3a2b','#106b52','#19c39c'],
  ['#3a2b0d','#6b4c10','#f5a623'], ['#1a1a1a','#333333','#8c8c8c'],
  ['#0b2e33','#0f5560','#22c1d6'], ['#330d1e','#6b1030','#ff2d6f']
];
function arteSv(titulo, w, h, subtitulo){
  const p = PALETAS[hash(titulo) % PALETAS.length];
  const cartaz = h >= w;                       // proporção de pôster (2:3)
  const limite = cartaz ? 12 : 17;             // nº de caracteres por linha
  const linhas = [];
  const palavras = (titulo||'').split(' ');
  let linha = '';
  palavras.forEach(pl => {
    if ((linha + ' ' + pl).trim().length > limite){ linhas.push(linha.trim()); linha = pl; }
    else linha = (linha + ' ' + pl).trim();
  });
  if (linha) linhas.push(linha);
  const usadas = linhas.slice(0, 4);
  const maisLonga = Math.max.apply(null, usadas.map(l => l.length).concat([1]));
  const fsBase = h / (usadas.length > 2 ? 6.2 : (cartaz ? 7 : 5));
  const fs = Math.round(Math.max(13, Math.min(fsBase, (w * 0.88) / (maisLonga * 0.60))));
  const y0 = h/2 - ((usadas.length-1) * fs * .58) + fs*.35;
  const txt = usadas.map((l,i) =>
    `<text x="${w/2}" y="${y0 + i*fs*1.16}" font-family="Helvetica,Arial,sans-serif" font-size="${fs}" font-weight="900"
      fill="#fff" text-anchor="middle" letter-spacing="-1">${esc(l)}</text>`).join('');
  const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${p[0]}"/><stop offset="55%" stop-color="${p[1]}"/><stop offset="100%" stop-color="${p[2]}"/>
  </linearGradient>
  <radialGradient id="r" cx="78%" cy="18%" r="72%">
    <stop offset="0" stop-color="rgba(255,255,255,.35)"/><stop offset="100%" stop-color="rgba(0,0,0,.25)"/>
  </radialGradient>
</defs>
<rect width="${w}" height="${h}" fill="url(#g)"/>
<rect width="${w}" height="${h}" fill="url(#r)"/>
<g opacity=".22" stroke="#fff" stroke-width="1.4" fill="none">
  <path d="M0 ${h*.78} Q ${w*.3} ${h*.5} ${w*.62} ${h*.74} T ${w} ${h*.42}"/>
  <circle cx="${w*.16}" cy="${h*.24}" r="${h*.16}"/>
</g>
${txt}
${subtitulo? `<text x="${w/2}" y="${h-14}" font-family="Helvetica,Arial,sans-serif" font-size="${Math.round(fs*.34)}"
   fill="rgba(255,255,255,.72)" text-anchor="middle" letter-spacing="4">${esc(subtitulo)}</text>`:''}
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

const IMG = 'https://image.tmdb.org/t/p/';
function temTMDB(){ return !!(cfg.tmdb && cfg.tmdb.trim().length > 10); }
function tmdbUrl(path, params){
  const u = new URL('https://api.themoviedb.org/3' + path);
  u.searchParams.set('language','pt-BR');
  u.searchParams.set('include_adult','false');
  Object.entries(params||{}).forEach(([k,v]) => v!=null && u.searchParams.set(k,v));
  if (!cfg.tmdb.trim().startsWith('eyJ')) u.searchParams.set('api_key', cfg.tmdb.trim());
  return u.toString();
}
async function tmdb(path, params){
  const headers = {};
  if (cfg.tmdb.trim().startsWith('eyJ')) headers.Authorization = 'Bearer ' + cfg.tmdb.trim();
  const r = await fetch(tmdbUrl(path, params), {headers});
  if (!r.ok) throw new Error('TMDB ' + r.status);
  return r.json();
}
async function tmdbBusca(q, tipo, ano){
  const j = await tmdb(`/search/${tipo === 'serie' ? 'tv' : 'movie'}`, {query:q, year:ano||null});
  return (j.results||[]).filter(x => (x.media_type||tipo) && (x.poster_path || x.backdrop_path));
}
async function tmdbDetalhe(id, tipo){
  return tmdb(`/${tipo === 'serie' ? 'tv' : 'movie'}/${id}`, {append_to_response:'images', include_image_language:'pt,en,null'});
}
function melhorLogo(det){
  const logos = ((det.images||{}).logos || []).slice();
  if (!logos.length) return null;
  const nota = l => (l.iso_639_1 === 'pt' ? 100 : l.iso_639_1 === 'en' ? 60 : 20) + (l.vote_average||0);
  logos.sort((a,b) => nota(b) - nota(a));
  return logos[0].file_path;
}
function mpItem(item, r){
  const m = meta[item.chave] || {};
  const poster = m.poster, backdrop = m.backdrop, logo = m.logo;
  return {
    arquivo:item, tmdbId: r.id, tipo: r.media_type || (r.title ? 'movie' : 'tv'),
    titulo: r.title || r.name || item.titulo,
    tituloOriginal: r.original_title || r.original_name || '',
    sinopse: r.overview || '',
    nota: typeof r.vote_average === 'number' ? r.vote_average : null,
    ano: (r.release_date || r.first_air_date || '').slice(0,4) || null,
    poster: r.poster_path || poster || null,
    backdrop: r.backdrop_path || backdrop || null,
    logo: logo || null,
    generos: (r.genres||[]).map(g => g.name),
    generosIds: (r.genre_ids|| (r.genres||[]).map(g=>g.id)),
    popularidade: r.popularity || 0,
    nTemp: r.number_of_seasons || null, nEps: r.number_of_episodes || null,
    duracao: r.runtime || null,
    em: Date.now()
  };
}

/* Sincronização completa com o TMDB */
let sincronizando = false;
async function sincronizarTudo(progressoCb){
  if (!temTMDB()) return {erro:'sem-chave'};
  sincronizando = true;
  const pendentes = ITENS.filter(i => !meta[i.chave] || !meta[i.chave].poster);
  let feitos = 0, erro = 0;
  const fila = pendentes.slice();
  async function trabalhador(){
    while (fila.length){
      const item = fila.shift();
      try{
        const queries = [];
        if (item.tmdb) queries.push(item.tmdb);
        if (item.alt && item.alt !== item.tmdb) queries.push(item.alt);
        if (!queries.includes(item.titulo)) queries.push(item.titulo);
        let achado = null, resultados = [];
        for (const q of queries){
          try{
            resultados = await tmdbBusca(q, item.tipo, item.tipo==='filme' ? (item.ano||null) : null);
            if (resultados.length){ achado = resultados[0]; break; }
          }catch(e){}
          await new Promise(r => setTimeout(r, 60));
        }
        if (achado){
          const det = await tmdbDetalhe(achado.id, item.tipo === 'filme' ? 'movie' : 'tv');
          const registro = mpItem(item, Object.assign({}, achado, det, {media_type: item.tipo==='filme'?'movie':'tv'}));
          if (det.images && det.images.logos) registro.logo = melhorLogo(det);
          meta[item.chave] = registro;
        } else { erro++; }
      }catch(e){ erro++; }
      feitos++;
      if (progressoCb) progressoCb(feitos, pendentes.length, item);
      if (feitos % 8 === 0) salvar(LS.meta, meta);
    }
  }
  await Promise.all(Array.from({length:6}, trabalhador));
  salvar(LS.meta, meta);
  sincronizando = false;
  return {feitos, erro, total:pendentes.length};
}

/* Busca episódios de uma temporada no TMDB */
async function carregarEpsTMDB(item, nTemp){
  const m = meta[item.chave]; if (!m || !m.tmdbId || !temTMDB()) return null;
  const k = m.tmdbId + ':' + nTemp;
  if (epsMeta[k]) return epsMeta[k];
  try{
    const j = await tmdb(`/${m.tmdbId}/season/${nTemp}`, {});
    const arr = (j.episodes||[]).map(e => ({e:e.episode_number, nome:e.name, sin:e.overview, img:e.still_path, d:e.runtime}));
    epsMeta[k] = arr; salvar(LS.eps, epsMeta); return arr;
  }catch(e){ return null; }
}

  const m = meta[item.chave];
  if (item.tipo === 'serie') return m && m.nTemp ? m.nTemp + ' temporada' + (m.nTemp>1?'s':'') : (item.temporadas.length + ' temporada' + (item.temporadas.length>1?'s':''));
  if (m && m.duracao) return Math.floor(m.duracao/60) + 'h ' + (m.duracao%60) + 'min';
  return '';
}
function anoDe(item){ const m = meta[item.chave]; return (m && m.ano) || item.ano || ''; }
function generosDe(item, n){
  const m = meta[item.chave];
  if (m && m.generos && m.generos.length) return m.generos.slice(0, n||3);
  return [];
}
function relevancia(item){
  const m = meta[item.chave];
  const base = m && m.nota ? Math.round(m.nota * 10) : 70 + (hash(item.chave) % 28);
  return Math.min(99, Math.max(55, base));
}
function progressoDe(item){
  const m = meta[item.chave]; const ids = item.tipo === 'serie'
    ? item.temporadas.flatMap(t => t.eps.map(e => e.id)) : [item.id];
  let melhor = null;
  ids.forEach(id => { const p = prog[id]; if (p && p.d && (!melhor || p.t > melhor.t)) melhor = Object.assign({id}, p); });
  if (!melhor) return null;
  return {pct: Math.min(98, Math.round(100 * melhor.t / melhor.d)), ...melhor};
}

function primeiroEp(item){

    return Object.assign({temp:t.n, nome:'Episódio ' + t.eps[0].e}, t.eps[0]);

}

const PADROES = {

  dc:/batman|superman|liga da justica|mulher maravilha|aquaman|flash|coringa|arlequina|squad/i,
  starwars:/star wars|guerra nas estrelas|jedi|sith|skywalker/i,
  animacao:/zootopia|toy story|shrek|carros|cars|trolls|minions|malvado|drag[aã]o|paddington|tadeo|gumball|phineas|jorel|jorel|esponja|mario|elementos|rei le[aã]o|lion|verso|encanto|moana|sing|divertida|angry|caras malvados|up |up:|big hero|dolittle|pijama/i,
  comedia:/gente grande|bicho vai pegar|big pai|esqueceram|click|todo poderoso|cabra|chefinho|gente|sempre ao seu lado|togo/i,
  fe:/deus nao|deus não|paulo|eternidade|orfao|órfão|poderoso/i,
  acao:/jurassic|velozes|missao|matrix|transformers|duna|top gun|predador|alien|rambo|tropa de elite|bastardos|pixels|backrooms|five nights/i,
  familia:/paddington|narnia|tadeo|fam[ií]lia|futuro|alice|trolls|carros|dragao|drag[aã]o/i
};
function casa(item, re){ return re.test(item.titulo) || re.test(item.busca||''); }
function colecaoDe(it){ const m = meta[it.chave]; return (m && m.colecao) ? m.colecao : null; }
/* ordem canônica das sagas que têm "Episódio I..IX" (Star Wars) */
const EPISODIOS = { 1893: 1, 1894: 2, 1895: 3, 11: 4, 1891: 5, 1892: 6, 140607: 7, 181808: 8, 181812: 9 };
function episodioDe(it){ const m = meta[it.chave]; return (m && EPISODIOS[m.tmdbId]) || null; }
/* dentro de uma franquia: episódio I..IX quando existir, senão ano de lançamento, senão A–Z */
function cmpFranquia(a, b){
  const ea = episodioDe(a), eb = episodioDe(b);
  if (ea != null && eb != null && ea !== eb) return ea - eb;
  if ((ea != null) !== (eb != null)) return ea != null ? -1 : 1;
  return (anoDe(a) || 9999) - (anoDe(b) || 9999) || (a.titulo || '').localeCompare(b.titulo || '', 'pt');
}
function colecaoIdDe(it){ const m = meta[it.chave]; return (m && m.colecaoId != null) ? m.colecaoId : null; }
/* deixa os títulos de uma mesma franquia lado a lado, em ordem de lançamento */
function clusterizar(arr){
  const lista = (arr||[]).slice(), out = [], usados = new Set();
  lista.forEach(it => {
    if (usados.has(it.chave)) return;
    const cid = colecaoIdDe(it);
    if (cid != null){
      lista.filter(x => !usados.has(x.chave) && colecaoIdDe(x) === cid)
        .sort(cmpFranquia)
        .forEach(g => { usados.add(g.chave); out.push(g); });
    } else { usados.add(it.chave); out.push(it); }
  });
  return out;
}
/* ordena um catálogo: franquias agrupadas (A–Z, e dentro da franquia por ano), depois avulsos A–Z */
function ordenarCatalogo(arr){
  const grupos = {}, sem = [], out = [];
  (arr||[]).forEach(i => {
    const cid = colecaoIdDe(i);
    if (cid != null) (grupos[cid] = grupos[cid] || []).push(i); else sem.push(i);
  });
  Object.keys(grupos)
    .sort((a,b) => String(colecaoDe(grupos[a][0])||'').localeCompare(String(colecaoDe(grupos[b][0])||''), 'pt'))
    .forEach(k => {
      grupos[k].sort(cmpFranquia).forEach(i => out.push(i));
    });
  sem.sort((a,b) => (a.titulo||'').localeCompare(b.titulo||'','pt')).forEach(i => out.push(i));
  return out;
}
/* fileiras "Coleções": uma por franquia com 2+ títulos na biblioteca */
function fileirasColecoes(P){
  const g = {};
  P.forEach(i => { const cid = colecaoIdDe(i); if (cid != null) (g[cid] = g[cid] || []).push(i); });
  return Object.entries(g).filter(([,a]) => a.length >= 2)
    .sort((a,b) => b[1].length - a[1].length).slice(0, 6)
    .map(([cid, arr]) => {
      const nome = String(colecaoDe(arr[0]) || '').replace(/\s*:?\s*Cole[çc][ãa]o\s*$/i, '').trim() || 'Franquia';
      return { t: nome + ' · Coleção', itens: arr.slice().sort(cmpFranquia), colecao: true };
    });
}
function montarFileiras(){
  const P = itens(), F = filmes(), S = series();
  const rows = [];
  const continuar = P.map(i => ({i, p:progressoDe(i)})).filter(x => x.p && x.p.pct > 2 && x.p.pct < 96)
                      .sort((a,b) => b.p.at - a.p.at).map(x => x.i);
  if (continuar.length) rows.push({t:`Continuar assistindo como ${perfilAtual().nome}`, itens:continuar.slice(0,12)});

  const top = P.slice().sort((a,b) => relevancia(b) - relevancia(a)).slice(0,10);
  rows.push({t:'Top 10 no Brasil hoje', itens:top, top:true});
  const NOVOS = F.slice().sort((a,b) => (b.sz||0) - (a.sz||0));
  rows.push({t:'Novidades no FaMovie', itens:S.concat(NOVOS).slice(0,14)});

  const generosMap = {};
  P.forEach(i => { const m = meta[i.chave]; (m && m.generos ? m.generos : []).forEach(g => { (generosMap[g] = generosMap[g] || []).push(i); }); });
  Object.entries(generosMap).sort((a,b) => b[1].length - a[1].length).slice(0,6)
    .forEach(([g, arr]) => { if (arr.length >= 4) rows.push({t:g, itens:arr.slice(0,16)}); });

  rows.push({t: perfilInfantil() ? 'Séries para crianças' : 'Séries premiadas', itens:S});
  rows.push({t:'Filmes para maratonar', itens:F.slice(0,14)});
  const marvel = P.filter(i => casa(i, PADROES.marvel));
  if (marvel.length >= 3) rows.push({t:'Universo Marvel', itens:marvel.slice(0,16)});
  const dc = P.filter(i => casa(i, PADROES.dc));
  if (dc.length >= 3) rows.push({t:'Universo DC', itens:dc.slice(0,16)});
  const sw = P.filter(i => casa(i, PADROES.starwars));
  if (sw.length >= 3) rows.push({t:'Star Wars — todas as sagas', itens:sw});
  fileirasColecoes(P).forEach(r => rows.push(r));
  const anim = P.filter(i => casa(i, PADROES.animacao) || ehInfantil(i));
  if (anim.length >= 3) rows.push({t:'Para a família toda', itens:anim.slice(0,16)});
  const acao = P.filter(i => casa(i, PADROES.acao));
  if (acao.length >= 3) rows.push({t:'Ação e adrenalina', itens:acao.slice(0,16)});
  const comedia = P.filter(i => casa(i, PADROES.comedia));
  if (comedia.length >= 3) rows.push({t:'Comédias para rir', itens:comedia.slice(0,16)});
  const fe = P.filter(i => casa(i, PADROES.fe));
  if (fe.length >= 3) rows.push({t:'Fé e inspiração', itens:fe.slice(0,14)});
  /* categorias extras por gênero do TMDB */
  const porGenero = (g) => P.filter(i => temGenero(i, g));
  const extras = [
    ['Terror e suspense', 'Terror', 2], ['Ficção científica', 'Ficção científica', 3],
    ['Suspense de tirar o fôlego', 'Suspense', 3], ['Mistérios para investigar', 'Mistério', 2],
    ['Documentários', 'Documentário', 2], ['Histórias de verdade', 'História', 2],
    ['Dramas que marcam', 'Drama', 4], ['Para curtir em família', 'Família', 4],
    ['Romances', 'Romance', 2], ['Crime e investigação', 'Crime', 3],
    ['Música e shows', 'Música', 2], ['Guerra e resistência', 'Guerra', 2],
    ['Animação', 'Animação', 4]
  ];
  let nExtras = 0;
  extras.forEach(([t, g, min]) => {
    if (nExtras >= 6) return;
    const arr = porGenero(g);
    if (arr.length >= min){ rows.push({t, itens:arr.slice(0,14)}); nExtras++; }
  });
  rows.push({t:'Continuar explorando', itens:P.slice(0,14)});
  rows.push({t:'Assista de novo', itens:F.slice(-12)});
  return rows.map(r => r.top ? r : Object.assign({}, r, {itens: clusterizar(r.itens)}));
}
function montarFileira(r){

/* ---------------- RENDER ---------------- */
function renderTudo(){
  montarLateral();
  montarHero();
  const cont = $('#conteudo');
  cont.innerHTML = '';
  const rows = montarFileiras();
  /* renderização em lotes: a home aparece na hora e o resto é montado em segundo plano,
     mantendo a rolagem e os cliques fluidos mesmo em máquinas simples */
  let i = 0;
  const lote = (tam) => {
    const fim = Math.min(i + tam, rows.length);
    for (; i < fim; i++) cont.appendChild(montarFileira(rows[i]));
    if (i < rows.length) setTimeout(() => lote(5), 16);
  };
  lote(12);
}
function irPara(qual){
  if (player.classList.contains('on')) fecharPlayer();
  telaBusca.classList.remove('on');
  paginaAtual = (qual === 'busca') ? paginaAtual : qual;
  marcarLateral(qual);
  if (qual === 'inicio'){ window.scrollTo({top:0,behavior:'smooth'}); return; }
  if (qual === 'busca'){ abrirTelaBusca(); sugestoes(); return; }
  if (qual === 'series') return abrirGrade({tipo:'serie', titulo:'Séries', ordenar:true});
  if (qual === 'filmes') return abrirGrade({tipo:'filme', titulo:'Filmes', ordenar:true});
  if (qual === 'lista'){
    const itens = lista.map(k => POR_CHAVE.get(k)).filter(Boolean);
    return abrirGrade({titulo:'Minha lista', itens, vazio:'Sua lista está vazia. Toque em <b>+</b> em qualquer título para salvar aqui.'});
  }
  if (qual === 'top') return abrirGrade({titulo:'Bombando agora', itens:itens().slice().sort((a,b)=>relevancia(b)-relevancia(a)).slice(0,30)});
  if (qual === 'todos') return abrirGrade({titulo:'Explorar catálogo completo', ordenar:true});

/* ---------------- GRADE / BUSCA ---------------- */
function abrirTelaBusca(){
  if (!telaBusca.dataset.pronta){
    telaBusca.dataset.pronta = '1';
    telaBusca.innerHTML = `
      <div class="topo-busca">

    const q = $('#q', telaBusca);
    q.addEventListener('input', () => { if (q.value.trim().length) buscar(q.value); else sugestoes(); });
    q.addEventListener('keydown', e => { if (e.key === 'Escape'){ fecharBusca(); } });

function corpoBusca(){ abrirTelaBusca(); return $('#busca-corpo'); }
function sugestoes(){
  const base = itens(), dia = new Date().toDateString();
  const arr = base.slice().sort((a,b) => (hash('sug' + a.chave + dia) % 997) - (hash('sug' + b.chave + dia) % 997)).slice(0, 18);
  const corpo = corpoBusca();

    <div style="color:#b3b3b3;font-size:14px;margin-bottom:10px">Digite na barra acima para buscar entre os ${base.length} títulos da sua biblioteca</div>
    <div class="grade" id="grade"></div>`;
  const g = $('#grade', corpo);
  arr.forEach(i => g.appendChild(cardItem(i, {poster: true})));
}

let filtroAtual = null;
let modoOrdem = 'franquia';   // 'franquia' (agrupado, na ordem da saga) | 'az' (alfabético puro)

/* nomes de gênero vindos do TMDB em inglês → português */
const GENERO_APELIDO = { 'Thriller':'Suspense', 'Sci-Fi & Fantasy':'Ficção científica', 'Kids':'Família', 'Action & Adventure':'Ação' };
const GENERO_OCULTO  = ['Cinema TV'];
function temGenero(it, g){ return generosDe(it, 20).some(x => (GENERO_APELIDO[x] || x) === g); }
function generosDaBiblioteca(arr){
  const m = {};
  (arr || []).forEach(i => generosDe(i, 20).forEach(g => {
    if (GENERO_OCULTO.includes(g)) return;
    const g2 = GENERO_APELIDO[g] || g;
    m[g2] = (m[g2] || 0) + 1;
  }));
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function ordenarAZ(arr){ return (arr || []).slice().sort((a, b) => (a.titulo || '').localeCompare(b.titulo || '', 'pt')); }
function repintarGrade(){
  if (!filtroAtual) return;
  const { base, opts, chip } = filtroAtual;
  let arr = base.slice();
  if (chip && chip.g) arr = arr.filter(i => temGenero(i, chip.g));
  else if (chip && chip.k === 'filme') arr = arr.filter(i => i.tipo === 'filme');
  else if (chip && chip.k === 'serie') arr = arr.filter(i => i.tipo === 'serie');
  else if (chip && chip.k && chip.k !== 'todos') arr = arr.filter(i => casa(i, PADROES[chip.k] || /$^/));
  if (modoOrdem === 'az') arr = ordenarAZ(arr);
  else if (opts.ordenar || (chip && chip.g)) arr = ordenarCatalogo(arr);
  pintarGrade(arr, opts.vazio);
}
function abrirGrade(opts){
  const viz = opts.itens || (opts.tipo ? (opts.tipo === 'serie' ? series() : filmes()) : itens());
  const corpo = corpoBusca();
  const fixos = [
    {k:'todos', t:'Tudo'}, {k:'filme', t:'Filmes'}, {k:'serie', t:'Séries'},
    {k:'marvel', t:'Marvel'}, {k:'dc', t:'DC'}, {k:'sw', t:'Star Wars'},
    {k:'anim', t:'Infantil'}, {k:'fe', t:'Fé'}
  ];
  const abreviar = { 'Ficção científica':'Ficção' };
  const chips = fixos.concat(
    generosDaBiblioteca(itens()).filter(([, n]) => n >= 3).slice(0, 15)
      .map(([g]) => ({ g, t: abreviar[g] || g }))
  );
  const chipInicial = opts.tipo === 'filme' ? {k:'filme'} : (opts.tipo === 'serie' ? {k:'serie'} : {k:'todos'});
  corpo.innerHTML = `<h2 style="font-size:clamp(22px,3vw,38px);margin:0 0 6px">${esc(opts.titulo || 'Explorar catálogo completo')}</h2>
    <div class="linha-grade">
      <div style="color:#b3b3b3;font-size:14px">${viz.length} títulos na sua biblioteca · ${chips.length - 1} filtros</div>
      <div class="ordem" id="ordem"><span>Ordenar:</span>
        <button data-o="franquia" class="${modoOrdem === 'franquia' ? 'on' : ''}">Franquias</button>
        <button data-o="az" class="${modoOrdem === 'az' ? 'on' : ''}">A–Z</button>
      </div>
    </div>
    <div id="filtros">${chips.map(c=>{
      const on = c.k && c.k === chipInicial.k;
      return `<button class="chip${on ? ' on' : ''}" ${c.k?`data-f="${c.k}"`:''} ${c.g?`data-g="${esc(c.g)}"`:''}>${esc(c.t)}</button>`;
    }).join('')}</div>
    <div class="grade" id="grade"></div>`;
  filtroAtual = { base: viz, opts, chip: chipInicial };
  $$('.chip', corpo).forEach(ch => ch.onclick = () => {
    $$('.chip', corpo).forEach(x => x.classList.remove('on')); ch.classList.add('on');
    filtroAtual.chip = { k: ch.dataset.f || null, g: ch.dataset.g || null };
    repintarGrade();
  });
  $$('#ordem button', corpo).forEach(b => b.onclick = () => {
    modoOrdem = b.dataset.o;
    $$('#ordem button', corpo).forEach(x => x.classList.toggle('on', x === b));
    repintarGrade();
  });
  repintarGrade();
  abrirTelaBusca();
}
function pintarGrade(itens, vazioTxt){
  const g = $('#grade'); if (!g) return;
  g.innerHTML = '';
  if (!itens.length){
    g.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#b3b3b3;padding:60px 0;font-size:16px;line-height:1.8">${vazioTxt || 'Nada encontrado por aqui. Tente outro termo.'}</div>`;
    return;
  }
  itens.forEach(i => g.appendChild(cardItem(i, {poster:true})));
}
function buscar(termo){
  if (!termo || !termo.trim()){ sugestoes(); return; }
  const t = sem(termo);
  const achados = itens().filter(i => sem(i.busca).includes(t) || sem(i.titulo).includes(t));
  abrirGrade({titulo:`Resultados para "${termo}"`, itens:achados, isBusca:true,
    vazio:`Nenhum título encontrado para <b>${esc(termo)}</b>.<br>Tente buscar por "vingadores", "gumball" ou "jurassic".`});
}
function fecharBusca(){
  telaBusca.classList.remove('on');
  const q = $('#q'); if (q) q.blur();
  marcarLateral(paginaAtual);
}

function fecharModal(){

}
function pintarEps(item){
  const cont = $('#m-lista-eps', modal); if (!cont) return;
  const t = item.temporadas.find(x => x.n === tempSel) || item.temporadas[0];
  cont.innerHTML = '<div class="eps">' + t.eps.map(e => {
    const pg = prog[e.id];
    const pct = pg && pg.d ? Math.min(100, Math.round(100*pg.t/pg.d)) : 0;
    return `<div class="ep" data-id="${esc(e.id)}" data-ep="${e.e}">
      <div class="n">${e.e}</div>
      <div class="mini"><img loading="lazy" src="${thumbDe(item,300)}" alt=""><div class="playme">${SVG.play.replace('<svg','<svg style="width:34px;height:34px;fill:#fff"')}</div></div>

        ${pct?`<div class="prog"><i style="width:${pct}%"></i></div>`:''}
      </div></div>`;
  }).join('') + '</div>';
  const metaT = epsMeta[(meta[item.chave]||{}).tmdbId + ':' + tempSel];
  if (metaT){
    metaT.forEach(info => {
      const novo = cont.querySelector(`.ep[data-ep="${info.e}"]`);
      if (!novo) return;
      const p = novo.querySelector('p'); if (p && info.sin) p.textContent = info.sin;
      const t1 = novo.querySelector('.t1 span'); if (t1 && info.nome) t1.textContent = info.nome;

    });

    carregarEpsTMDB(item, tempSel).then(() => { if (itemModal === item) pintarEps(item); });

    const id = elEp.dataset.id, n = +elEp.dataset.ep;

/* ---------------- ASSISTIR (player do Google Drive, com a barra sempre visível) ---------------- */
let P = null;
function tocar(item, ep){
  if (!ep) ep = primeiroEp(item);
  if (!ep || !ep.id){ toast('Este título não tem arquivo para reproduzir.'); return; }
  fecharModal(); fecharBusca();
  player.classList.add('on');
  document.body.classList.add('travado'); document.body.classList.add('assistindo');
  player.innerHTML = `
    <div class="quadro-cheio">
      <iframe id="p-frame" src="https://drive.google.com/file/d/${esc(ep.id)}/preview" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
    </div>
    <button class="voltar-flutuante" id="p-voltar" title="Voltar (Esc)" aria-label="Voltar">${SVG.voltar}</button>
    <div class="dica-assistindo">${esc(item.titulo)}${item.tipo === 'serie' && ep.n ? ` · T${ep.temp || 1}:E${ep.n}` : ''}</div>`;
  prog[ep.id] = {t: 5, d: 100, item: item.chave, ep: ep.n, temp: ep.temp, at: Date.now()};
  salvarProg();
  P = {item, ep};
  $('#p-voltar').onclick = fecharPlayer;
  tentarTelaCheia();          // o clique em Assistir é um gesto do usuário: entra em tela cheia de verdade
  player.ondblclick = tentarTelaCheia;
  document.onkeydown = e => {
    if (!player.classList.contains('on')) return;
    if (e.key === 'Escape'){
      if (document.fullscreenElement && document.exitFullscreen){ try{ document.exitFullscreen(); }catch(_e){} return; }
      fecharPlayer();
    }
  };
  window.scrollTo({top: 0});
}
function tentarTelaCheia(){
  try{
    if (!document.fullscreenElement && player.requestFullscreen){
      const r = player.requestFullscreen();
      if (r && r.catch) r.catch(() => {});
    }
  }catch(e){}
}
function fecharPlayer(){
  document.onkeydown = null;
  try{ if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  player.classList.remove('on'); player.innerHTML = '';
  document.body.classList.remove('travado'); document.body.classList.remove('assistindo');
  P = null;
  renderTudo();
}

function abrirEditor(idx){
  const base = idx === null

        </div>
      </div>

        <button class="btn-cheio" id="ed-salvar">Salvar</button>
        <button class="btn-linha" id="ed-cancelar">Cancelar</button>
        ${idx !== null && perfis.length > 1 ? '<button class="btn-linha perigo" id="ed-excluir">Excluir perfil</button>' : ''}
      </div>
    </div>`;
  telaPerfis.appendChild(caixa);
  const pintar = () => {
    $('#ed-prev').innerHTML = blocoAvatar(editando, 300);
    $('#ed-faces').innerHTML = FACES.map(f =>
      `<button class="face${editando.face === f.id ? ' on' : ''}" data-face="${f.id}" title="${f.nome}">
         <img src="${avatarSVG(editando.cor, f.id, 128)}" alt="${f.nome}"></button>`).join('');
    $('#ed-cores').innerHTML = CORES.map(c =>
      `<button class="cor${editando.cor === c ? ' on' : ''}" data-cor="${c}" style="background:${c}"></button>`).join('');
    $$('#ed-faces .face', caixa).forEach(b => b.onclick = () => { editando.face = b.dataset.face; pintar(); });
    $$('#ed-cores .cor', caixa).forEach(b => b.onclick = () => { editando.cor = b.dataset.cor; pintar(); });
  };
  pintar();
  $('#ed-nome').oninput = e => { editando.nome = e.target.value; };
  $('#ed-infantil').onchange = e => { editando.infantil = e.target.checked; };
  $('#ed-cancelar').onclick = () => caixa.remove();
  caixa.onclick = e => { if (e.target === caixa) caixa.remove(); };
  if ($('#ed-excluir')) $('#ed-excluir').onclick = () => {
    if (!confirm('Excluir o perfil "' + perfis[editando.idx].nome + '"?')) return;
    perfis.splice(editando.idx, 1);
    salvar(LS.perfis, perfis);
    if (perfilAtivo >= perfis.length) perfilAtivo = perfis.length - 1;
    salvar(LS.ativo, perfilAtivo);
    carregarEstadoPerfil(); montarPerfis(); montarLateral(); renderTudo();
    caixa.remove(); toast('Perfil excluído');
  };
  $('#ed-salvar').onclick = () => {
    const nome = (editando.nome || '').trim() || 'Perfil';
    const dados = { nome, cor:editando.cor, face:editando.face, infantil:!!editando.infantil };
    if (editando.idx === null){
      dados.id = perfis.length;
      perfis.push(dados);
      toast('Perfil de ' + nome + ' criado!');
    } else {
      dados.id = perfis[editando.idx].id;
      perfis[editando.idx] = dados;
      toast('Perfil atualizado');
    }
    salvar(LS.perfis, perfis);
    caixa.remove();
    montarPerfis(); montarLateral();
    if (perfilAtivo === editando.idx || editando.idx === null) renderTudo();
  };
  $('#ed-nome').focus();
}

function tudumSom(){
  if (!cfg.som) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = new AC();
    const master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);
    const rev = ctx.createConvolver();
    const len = ctx.sampleRate * 1.2, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c=0;c<2;c++){ const d = buf.getChannelData(c);
      for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6); }
    rev.buffer = buf;
    const revG = ctx.createGain(); revG.gain.value = .35; rev.connect(revG); revG.connect(master);
    function golpe(freq, t0, dur, vol){
      const g = ctx.createGain(); g.connect(master); g.connect(rev);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(1400, t0);
      f.frequency.exponentialRampToValueAtTime(320, t0 + dur); f.connect(g);
      [[1,1],[2,.5],[3,.28],[4.5,.14],[6,.07]].forEach(([m,v]) => {
        const o = ctx.createOscillator(); o.type = m === 1 ? 'triangle' : 'sine';
        o.frequency.setValueAtTime(freq*m, t0);
        o.frequency.exponentialRampToValueAtTime(freq*m*.985, t0+dur);
        const og = ctx.createGain(); og.gain.value = v; o.connect(og); og.connect(f);
        o.start(t0); o.stop(t0 + dur + .05);
      });
    }
    const t = ctx.currentTime + .06;
    golpe(58.27, t, .75, .85);        // "ta"
    golpe(87.31, t + .30, 2.6, 1.0);  // "dum"
  }catch(e){}
}

let ehMobile = false;
function detectarDispositivo(){
  const ua = navigator.userAgent || '';
  const uaMovel = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile|webOS|BlackBerry|Tablet/i.test(ua);
  let estreita = false;
  try{ estreita = window.matchMedia ? window.matchMedia('(max-width: 820px)').matches : (window.innerWidth <= 820); }catch(e){ estreita = window.innerWidth <= 820; }
  definirDispositivo(uaMovel || estreita);
  return ehMobile;
}
